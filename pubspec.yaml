name: dayflow
description: A polished offline-first personal calendar and productivity app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  shared_preferences: 2.5.3
  intl: 0.20.2
  google_fonts: 6.2.1
  table_calendar: 3.2.0
  flutter_local_notifications: 19.4.2
  timezone: 0.10.1
  fl_chart: 0.71.0
  uuid: 4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
